# UNTESTED mod. Builds the plugin on GitHub, packs miside-minecraft-mod.zip and
# publishes it as a GitHub Release (see "Releases" on the repository's main page).
name: Build mod
on:
  workflow_dispatch:
  push:
    paths: ["src/**", ".github/workflows/build.yml", "nuget.config"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build src/MiSideMinecraft.CI.csproj -c Release -o out
      - name: Pack
        shell: pwsh
        run: Compress-Archive -Path out/MiSideMinecraft.dll -DestinationPath miside-minecraft-mod.zip
      - uses: actions/upload-artifact@v4
        with:
          name: miside-minecraft-mod
          path: miside-minecraft-mod.zip
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER"
          gh release create $tag miside-minecraft-mod.zip --title "Build $env:GITHUB_RUN_NUMBER (untested)" --notes "Untested build of the MiSide x Minecraft plugin. Contains MiSideMinecraft.dll." --repo $env:GITHUB_REPOSITORY
